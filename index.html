<html>
<head>
	<title>Morse Code Drill</title>
	<!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">

	<!-- Optional theme -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap-theme.min.css" integrity="sha384-fLW2N01lMqjakBkx3l/M9EahuwpSfeNvV63J5ezn3uZzapT0u7EYsXMjQV+0En5r" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/game.css">

</head>
<body>
	<div class="container-fluid">
	<h3>Morse Code Drill</h3>
		<div class="row">
			<div class="col-md-1"></div>
			<div class="col-md-7">Practice</div>
			<div id="cheatsheet" class="col-md-3"></div>
			<div class="col-md-1"></div>
		</div>
	</div>

	<!-- Full-page cheatsheet at bottom -->
	<div class="container">
		<hr>
		<h4>Cheatsheet</h4>
		<div id="cheatsheet-bottom">
		  <div class="keyboard-cheatsheet">
		    <!-- numbers row -->
		    <div class="kbd-row">
		      <div class="kbd-key"><div class="char">1</div><div class="morse">.----</div></div>
		      <div class="kbd-key"><div class="char">2</div><div class="morse">..---</div></div>
		      <div class="kbd-key"><div class="char">3</div><div class="morse">...--</div></div>
		      <div class="kbd-key"><div class="char">4</div><div class="morse">....-</div></div>
		      <div class="kbd-key"><div class="char">5</div><div class="morse">.....</div></div>
		      <div class="kbd-key"><div class="char">6</div><div class="morse">-....</div></div>
		      <div class="kbd-key"><div class="char">7</div><div class="morse">--...</div></div>
		      <div class="kbd-key"><div class="char">8</div><div class="morse">---..</div></div>
		      <div class="kbd-key"><div class="char">9</div><div class="morse">----.</div></div>
		      <div class="kbd-key"><div class="char">0</div><div class="morse">-----</div></div>
		    </div>
		    <!-- QWERTY row -->
		    <div class="kbd-row">
		      <div class="kbd-key"><div class="char">Q</div><div class="morse">--.-</div></div>
		      <div class="kbd-key"><div class="char">W</div><div class="morse">.--</div></div>
		      <div class="kbd-key"><div class="char">E</div><div class="morse">.</div></div>
		      <div class="kbd-key"><div class="char">R</div><div class="morse">.-.</div></div>
		      <div class="kbd-key"><div class="char">T</div><div class="morse">-</div></div>
		      <div class="kbd-key"><div class="char">Y</div><div class="morse">-.--</div></div>
		      <div class="kbd-key"><div class="char">U</div><div class="morse">..-</div></div>
		      <div class="kbd-key"><div class="char">I</div><div class="morse">..</div></div>
		      <div class="kbd-key"><div class="char">O</div><div class="morse">---</div></div>
		      <div class="kbd-key"><div class="char">P</div><div class="morse">.--.</div></div>
		    </div>
		    <!-- ASDF row -->
		    <div class="kbd-row">
		      <div class="kbd-key"><div class="char">A</div><div class="morse">.-</div></div>
		      <div class="kbd-key"><div class="char">S</div><div class="morse">...</div></div>
		      <div class="kbd-key"><div class="char">D</div><div class="morse">-..</div></div>
		      <div class="kbd-key"><div class="char">F</div><div class="morse">..-.</div></div>
		      <div class="kbd-key"><div class="char">G</div><div class="morse">--.</div></div>
		      <div class="kbd-key"><div class="char">H</div><div class="morse">....</div></div>
		      <div class="kbd-key"><div class="char">J</div><div class="morse">.---</div></div>
		      <div class="kbd-key"><div class="char">K</div><div class="morse">-.-</div></div>
		      <div class="kbd-key"><div class="char">L</div><div class="morse">.-..</div></div>
		    </div>
		    <!-- ZXCV row -->
		    <div class="kbd-row">
		      <div class="kbd-key"><div class="char">Z</div><div class="morse">--..</div></div>
		      <div class="kbd-key"><div class="char">X</div><div class="morse">-..-</div></div>
		      <div class="kbd-key"><div class="char">C</div><div class="morse">-.-.</div></div>
		      <div class="kbd-key"><div class="char">V</div><div class="morse">...-</div></div>
		      <div class="kbd-key"><div class="char">B</div><div class="morse">-...</div></div>
		      <div class="kbd-key"><div class="char">N</div><div class="morse">-.</div></div>
		      <div class="kbd-key"><div class="char">M</div><div class="morse">--</div></div>
		    </div>
		  </div>
		</div>
	</div>
	</div>
	<!-- jQuery (required for Bootstrap and the app) -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
	<!-- Latest compiled and minified JavaScript -->
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS" crossorigin="anonymous"></script>
	<script src="static/js/main.js"></script>
</body>
</html>
